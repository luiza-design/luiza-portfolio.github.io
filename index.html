<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lu — Shopify Specialist</title>

  <!-- Premium editorial serif font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;

      background: #3E000C;
      color: #F6EBDD;

      font-family: "DM Sans", sans-serif;

      overflow-x: hidden;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 680px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(110, 17, 37, 0.35) 0%,
          rgba(62, 0, 12, 0) 48%
        ),
        #3E000C;
    }


    /* =========================
       SUBTLE GRAIN
    ========================= */

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      opacity: 0.055;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");

      z-index: 20;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      position: absolute;

      top: 30px;
      left: 42px;
      right: 42px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 50;
    }


    .logo {
      font-family: "Bodoni Moda", serif;

      font-size: 34px;
      font-weight: 400;

      line-height: 1;

      letter-spacing: -2px;

      color: #F6EBDD;
    }


    .menu {
      display: flex;
      align-items: center;
      gap: 13px;

      border: 0;
      background: transparent;

      color: #F6EBDD;

      font-family: "DM Sans", sans-serif;
      font-size: 9px;
      font-weight: 500;

      letter-spacing: 4px;

      cursor: pointer;
    }


    .menu-icon {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }


    .menu-icon span {
      display: block;

      width: 27px;
      height: 1px;

      background: #F6EBDD;
    }


    /* =========================
       INTRO
    ========================= */

    .intro {
      position: absolute;

      top: 17%;
      left: 6%;

      display: flex;
      align-items: center;
      gap: 17px;

      z-index: 30;

      color: #F6EBDD;

      font-family: "DM Sans", sans-serif;
      font-size: 9px;
      font-weight: 500;

      letter-spacing: 5px;

      white-space: nowrap;
    }


    .intro-line {
      width: 42px;
      height: 1px;

      background: #F6EBDD;

      opacity: 0.8;
    }


    /* =========================
       BIG P
    ========================= */

    .big-letter {
      position: absolute;

      left: 50%;
      top: 52%;

      transform:
        translate(-50%, -50%)
        scale(1);

      z-index: 5;

      color: #F6EBDD;

      font-family: "Bodoni Moda", serif;

      font-size: clamp(330px, 47vw, 760px);

      font-weight: 400;

      line-height: 0.72;

      letter-spacing: -0.09em;

      user-select: none;

      animation: letterReveal 1.5s cubic-bezier(.16,1,.3,1) both;
    }


    @keyframes letterReveal {

      from {
        opacity: 0;

        transform:
          translate(-50%, -45%)
          scale(0.92);
      }

      to {
        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

    }


    /* =========================
       BOTTOM
    ========================= */

    .bottom {
      position: absolute;

      left: 6%;
      right: 6%;
      bottom: 38px;

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: end;

      z-index: 30;
    }


    .section-name {
      color: #F6EBDD;

      font-family: "Bodoni Moda", serif;

      font-size: 18px;
      font-weight: 400;

      letter-spacing: 6px;
    }


    .number {
      color: #F6EBDD;

      font-family: "DM Sans", sans-serif;

      font-size: 9px;

      letter-spacing: 4px;

      opacity: 0.9;
    }


    .scroll {
      justify-self: end;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      gap: 11px;

      color: #F6EBDD;

      font-size: 8px;
      letter-spacing: 4px;
    }


    .scroll-arrow {
      font-family: Arial, sans-serif;

      font-size: 23px;

      line-height: 1;

      animation:
        scrollMove 1.8s ease-in-out infinite;
    }


    @keyframes scrollMove {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      50% {
        transform: translateY(8px);
        opacity: 1;
      }

    }


    /* =========================
       DESKTOP DETAILS
    ========================= */

    .edge-line {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 1px;

      background: rgba(246, 235, 221, 0.18);

      z-index: 30;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      .hero {
        height: 100svh;
        min-height: 620px;
      }


      .header {
        top: 23px;
        left: 22px;
        right: 22px;
      }


      .logo {
        font-size: 29px;
      }


      .menu {
        font-size: 8px;
        letter-spacing: 3px;
      }


      .menu-icon span {
        width: 23px;
      }


      .intro {
        top: 16%;
        left: 22px;

        gap: 11px;

        font-size: 7px;

        letter-spacing: 3px;
      }


      .intro-line {
        width: 25px;
      }


      .big-letter {
        top: 49%;

        font-size: 110vw;

        letter-spacing: -0.11em;
      }


      .bottom {
        left: 22px;
        right: 22px;
        bottom: 25px;
      }


      .section-name {
        font-size: 13px;
        letter-spacing: 4px;
      }


      .number {
        font-size: 8px;
        letter-spacing: 3px;
      }


      .scroll {
        font-size: 7px;
        letter-spacing: 2px;
        gap: 8px;
      }


      .scroll-arrow {
        font-size: 19px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">


    <!-- HEADER -->

    <header class="header">

      <div class="logo">
        LU
      </div>


      <button class="menu" type="button">

        <span>MENU</span>

        <span class="menu-icon">
          <span></span>
          <span></span>
        </span>

      </button>

    </header>


    <!-- INTRO -->

    <div class="intro">

      <span class="intro-line"></span>

      <span>SHOPIFY SPECIALIST</span>

    </div>


    <!-- MAIN LETTER -->

    <div class="big-letter">
      P
    </div>


    <!-- BOTTOM -->

    <div class="bottom">

      <div class="section-name">
        PROJECTS
      </div>


      <div class="number">
        01
      </div>


      <div class="scroll">

        <span>SCROLL</span>

        <span class="scroll-arrow">
          ↓
        </span>

      </div>

    </div>


    <div class="edge-line"></div>

  </section>


</body>
</html>
